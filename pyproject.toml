[tool.poetry]
name = "tech-challenge-fase2"
version = "0.1.0"
description = "Otimização de modelos de diagnóstico para saúde da mulher via algoritmos genéticos + LLMs"
authors = ["FIAP PosTech"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
scikit-learn = "^1.4"
numpy = "^1.26"
pandas = "^2.2"
matplotlib = "^3.8"
seaborn = "^0.13"
openai = "^2.0"
streamlit = "^1.35"
python-dotenv = "^1.0"
plotly = "^5.22"
imbalanced-learn = "^0.12"
deap = "^1.4"
neat-python = "^0.92"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
